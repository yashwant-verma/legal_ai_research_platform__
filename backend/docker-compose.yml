services:
  mongo:
    image: mongo:8
    container_name: legal-ai-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - legal_ai_mongo:/data/db

  qdrant:
    image: qdrant/qdrant:latest
    container_name: legal-ai-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - legal_ai_qdrant:/qdrant/storage

volumes:
  legal_ai_mongo:
  legal_ai_qdrant:
